name: build-gentoo-base

# Optional manual maintenance for the retained Gentoo container fixture.
# TajsDesktop CI targets CachyOS only; this image is not built on a schedule
# or used by the tests workflow.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Gentoo base image
        run: |
          docker build \
            -f tests/containers/Dockerfile.gentoo-base \
            -t ghcr.io/${{ github.repository_owner }}/mttkde-gentoo-base:latest \
            .

      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/mttkde-gentoo-base:latest
